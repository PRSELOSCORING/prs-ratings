name: Update ratings

on:
  schedule:
    # Every hour. Most runs finish in seconds ("nothing due"); results are pulled in the first hour
    # after a match's scheduled end, re-checked hourly for 48h, and a full check runs daily at 03:00 UTC.
    - cron: "23 * * * *"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab (always a full run)

permissions:
  contents: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ratings
        run: python pipeline.py ${{ github.event_name == 'schedule' && '--auto' || '' }}

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update ratings $(date -u +%Y-%m-%d)"
          git push
