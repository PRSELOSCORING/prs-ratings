name: Update ratings

on:
  schedule:
    # 03:00 UTC Monday and Tuesday = Sunday and Monday 10pm Central (9pm once daylight saving ends)
    - cron: "0 3 * * 1,2"
  workflow_dispatch: {}   # "Run workflow" button on the Actions tab

permissions:
  contents: write

concurrency:
  group: update-ratings
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Update ratings
        run: python pipeline.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data docs
          git diff --cached --quiet || git commit -m "Update ratings $(date -u +%Y-%m-%d)"
          git push
